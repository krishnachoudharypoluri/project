[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shopassist-ai"
version = "0.1.0"
description = "A retrieval-grounded e-commerce assistant built with FastAPI and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
chroma = ["langchain-chroma>=0.2"]
postgres = ["langchain-postgres>=0.0.12", "psycopg[binary]>=3.2"]
mongodb = ["pymongo>=4.10"]
all = [
    "langchain-chroma>=0.2",
    "langchain-postgres>=0.0.12",
    "psycopg[binary]>=3.2",
    "pymongo>=4.10",
]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]